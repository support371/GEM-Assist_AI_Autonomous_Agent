name: GEM Taskade Deploy

on:
  push:
    branches: [main]
    paths: ['gem-taskade/**','.github/workflows/gem-taskade-deploy.yml']
  pull_request:
    branches: [main]
    paths: ['gem-taskade/**','.github/workflows/gem-taskade-deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────
  # 1. Validate · syntax, types, schema
  # ────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: cd gem-taskade && npm ci --no-audit --no-fund
      - run: cd gem-taskade && npm run agents:build
      - name: Syntax check workers
        run: |
          for f in gem-taskade/workers/telegram-bot.js workers/lib/*.js workers/prebuild.mjs; do
            node --check "$f" && echo "✓ $f"
          done

  # ────────────────────────────────────────────────
  # 2. Build frontend
  # ────────────────────────────────────────────────
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: cd gem-taskade && npm ci --no-audit --no-fund
      - name: Build
        run: cd gem-taskade && npm run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LLM_PROXY_URL:     ${{ secrets.VITE_LLM_PROXY_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: gem-taskade/dist/ }

  # ────────────────────────────────────────────────
  # 3. Deploy Cloudflare Worker (bot + /llm + /agent)
  # ────────────────────────────────────────────────
  deploy-worker:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: cd gem-taskade && npm ci --no-audit --no-fund
      - name: GEM Taskade Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gem-taskade/workers
          command: deploy telegram-bot.js
          preCommands: node prebuild.mjs
          secrets: |
            TG_BOT_TOKEN
            TG_WEBHOOK_SECRET
            TG_CHANNEL
            ADMIN_SECRET
            ALLOWED_ORIGINS
            GEMINI_API_KEY
            GROQ_API_KEY
            SUPABASE_URL
            SUPABASE_SERVICE_KEY
        env:
          TG_BOT_TOKEN:         ${{ secrets.TG_BOT_TOKEN }}
          TG_WEBHOOK_SECRET:    ${{ secrets.TG_WEBHOOK_SECRET }}
          TG_CHANNEL:           ${{ secrets.TG_CHANNEL }}
          ADMIN_SECRET:         ${{ secrets.ADMIN_SECRET }}
          ALLOWED_ORIGINS:      ${{ secrets.ALLOWED_ORIGINS }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ────────────────────────────────────────────────
  # 4. Deploy Vercel frontend
  # ────────────────────────────────────────────────
  deploy-vercel:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g vercel@latest
      - name: Pull Vercel config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: GEM Taskade Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"
    outputs:
      url: ${{ steps.deploy.outputs.url }}

  # ────────────────────────────────────────────────
  # 5. Smoke test the live deployment
  # ────────────────────────────────────────────────
  smoke-test:
    needs: [deploy-worker, deploy-vercel]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Smoke test
        env:
          WORKER_URL:   ${{ secrets.WORKER_URL }}
          FRONTEND_URL: ${{ needs.deploy-vercel.outputs.url }}
        run: node gem-taskade/scripts/smoke-test.mjs
