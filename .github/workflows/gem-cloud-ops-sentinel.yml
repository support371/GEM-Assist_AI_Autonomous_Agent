name: GEM Cloud Operations Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: gem-cloud-ops-sentinel
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only GEM delta inspection
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate sentinel syntax
        run: node --check scripts/gem-ops-sentinel.mjs

      - name: Run sentinel smoke test
        run: node tests/gem-ops-sentinel.smoke.mjs

      - name: Restore previous sentinel state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .gem-ops-cache
          key: gem-ops-state-${{ github.run_id }}
          restore-keys: |
            gem-ops-state-

      - name: Run GEM Cloud Operations Sentinel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEM_OPS_CONFIG: config/gem-ops.targets.json
          GEM_OPS_OUTPUT_DIR: artifacts/gem-ops
          GEM_OPS_PREVIOUS_STATE: .gem-ops-cache/latest.json
        shell: bash
        run: |
          mkdir -p artifacts/gem-ops
          set +e
          node scripts/gem-ops-sentinel.mjs > artifacts/gem-ops/console.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "GEM sentinel failed with exit code $code"
            tail -n 30 artifacts/gem-ops/console.log
            exit "$code"
          fi
          echo "GEM sentinel completed; detailed runtime output is retained only in the runner workspace unless this repository is private."

      - name: Publish private operational summary
        if: always() && github.event.repository.private == true
        shell: bash
        run: |
          if [ -f artifacts/gem-ops/latest.md ]; then
            cat artifacts/gem-ops/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# GEM Cloud Operations Sentinel" >> "$GITHUB_STEP_SUMMARY"
            echo "Sentinel did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish public-safe operational summary
        if: always() && github.event.repository.private != true
        shell: bash
        run: |
          echo "# GEM Cloud Operations Sentinel" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/gem-ops/latest.json ]; then
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("artifacts/gem-ops/latest.json","utf8"));console.log(`- **Overall state:** ${r.overallState}\n- **Checks:** ${r.counts.checked}\n- **Failures:** ${r.counts.failed}\n- **Material changes:** ${r.delta.materialChanges.length}\n- **Detail exposure:** suppressed because this repository is public`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sentinel did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload detailed sentinel report
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: gem-ops-report-${{ github.run_number }}
          path: artifacts/gem-ops/
          if-no-files-found: warn
          retention-days: 14

      - name: Save current sentinel state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .gem-ops-cache
          key: gem-ops-state-${{ github.run_id }}
